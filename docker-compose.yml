services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acit-gateway
    ports:
      - "8000:8000"
    # Required secrets fail the `up` with a named variable instead of starting a
    # container that dies on Settings validation. Copy .env.example to .env.
    environment:
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:?copy .env.example to .env and set it}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:?copy .env.example to .env and set it}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:?copy .env.example to .env and set it}
      - JWT_SECRET=${JWT_SECRET:?copy .env.example to .env and set it}
      - API_KEY=${API_KEY:?copy .env.example to .env and set it}
      - AUDIT_ADMIN_API_KEY=${AUDIT_ADMIN_API_KEY:?copy .env.example to .env and set it}
      - DATABASE_URL=sqlite:///./data/acit.db
      - CHAOS_ENABLED=${CHAOS_ENABLED:-false}
      - CHAOS_FAILURE_RATE=${CHAOS_FAILURE_RATE:-0.05}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MCP_ENABLED=${MCP_ENABLED:-false}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: SQLite inspection tool
  sqlite-utils:
    image: python:3.11-slim
    container_name: acit-sqlite-utils
    entrypoint: ["sqlite-utils"]
    volumes:
      - ./data:/data
    profiles:
      - tools

networks:
  default:
    name: acit-network
