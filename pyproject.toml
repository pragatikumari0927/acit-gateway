[project]
name = "acit-gateway"
version = "0.1.0"
description = "Inbound test-mode bridge from agent Protocol envelopes to Razorpay Money actions."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "PyJWT[crypto]>=2.9,<3",
    "cryptography>=43,<46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
