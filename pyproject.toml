[project]
name = "acit-gateway"
version = "1.0.0"
description = "ACIT Gateway — test-mode agentic payment bridge (Razorpay Buildathon)"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic>=2.9.0",
    "pydantic-settings==2.1.0",
    "python-dotenv>=1.1.0",
    "sqlalchemy==2.0.52",
    "aiosqlite==0.19.0",
    "razorpay==1.4.2",
    "pyjwt==2.7.0",
    "cryptography==41.0.7",
    "python-multipart==0.0.6",
    "email-validator>=1.1.0,<2.1",
    "httpx==0.25.1",
    "authlib==1.3.0",
    "fastapi-users==12.1.0",
    "setuptools>=65.5.0",
    "sqlmodel>=0.0.16",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "ruff==0.1.0",
    "mypy==1.7.0",
    "hypothesis==6.92.0",
    "bandit==1.7.5",
    "sqlite-utils==3.37.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI Depends() in parameter defaults is idiomatic. Migrating call
# sites to Annotated[X, Depends()] is a backlog ticket — do not add
# per-site noqas for B008.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=0.21.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
